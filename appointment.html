</head>
<body>

<nav>
    <div class="logo">CareBook</div>
    <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="about.html">About</a></li>
        <li><a href="services.html">Services</a></li>

        <li><a href="contact.html">Contact</a></li>
        <li><a href="booked.html">Booked</a></li>
    </ul>
</nav>

<form id="appointmentForm">
    <h2>Book Appointment</h2>
    <input type="text" id="name" placeholder="Your Name" required>
    <input type="email" id="email" placeholder="Your Email" required>
    <select id="doctor" required>
        <option value="">Select Doctor</option>
        <option>Farjana Akter</option>
        <option>Samia Islam</option>
        <option>Marzia</option>
        <option>Mehzaben Hawladar Sinka</option>
        <option>Marjia Salehin</option>
    </select>
    <input type="date" required>
    <textarea placeholder="Describe Problem"></textarea>
    <button type="submit">Book Appointment</button>
</form>

<h2 id="message" style="text-align:center;color:green;"></h2>

<script>
document.getElementById("appointmentForm").addEventListener("submit", function(e){
    e.preventDefault();

    let name = document.getElementById("name").value;
    let doctor = document.getElementById("doctor").value;

    document.getElementById("message").innerHTML =
        "✅ Appointment booked successfully for " + name + " with Dr. " + doctor;

    let totalAppointments = localStorage.getItem("appointments");
    if(totalAppointments == null){ totalAppointments = 0; }
    totalAppointments++;
    localStorage.setItem("appointments", totalAppointments);

    document.getElementById("appointmentForm").reset();

    setTimeout(function(){
        window.location.href = "booked.html";
    }, 2000);
});
</script>

<footer>CareBook Hospital © 2026</footer>
</body>
</html>
